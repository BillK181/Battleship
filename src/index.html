
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>

    <div id="turn-switch-popup">
        <div class="turn-popup-content">
            <h1 id="turn-message">Player 2's Turn</h1>
            <button id="continue-game">Continue</button>
        </div>
    </div>

    <h1>Battleship</h1>

    <div id="game-mode">
        <h2>Select Game Mode</h2>
        <button id="pvp">Player vs Player</button>
        <button id="pvc">Player vs Computer</button>
    </div>

    <div id="attack-mode"></div>

    <div id="winner"></div>

    <div class="game-container">
        <div class="player1-container">
            <h2>Player 1</h2>
            <div id="player1-board" class="board"></div>
        </div>

        <div class="player2-container">
            <h2>Player 2</h2>
            <div id="player2-board" class="board"></div>
        </div>

        <div id="placement-controls">
            <div id="countdown"></div>
            <button id="confirm-placement"></button>
        </div>
        
    </div>

    <div id="random-placement-container"></div>

    <div id="ships-container">
    </div>

    <div id="direction-container">
    </div>


</body>
</html>
